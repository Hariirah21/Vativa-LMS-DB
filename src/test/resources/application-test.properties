spring.datasource.url=jdbc:h2:mem:vativa_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-only-jwt-secret-that-is-at-least-32-characters
app.jwt.expiration-ms=3600000

resend.api-key=test-key
resend.from-email=test@example.com
resend.from-name=Vativa LMS Test

lms.multimedia.storage-location=${java.io.tmpdir}/vativa-test-multimedia
lms.multimedia.max-file-size=1MB
lms.multimedia.supported-file-types=mp4,pdf,png
lms.ebook.storage-location=${java.io.tmpdir}/vativa-test-ebooks
lms.ebook.max-media-size=50MB
