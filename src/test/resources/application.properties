spring.datasource.url=jdbc:h2:mem:lms_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.task.scheduling.enabled=false

app.jwt.secret=test-only-secret-key-that-is-at-least-32-bytes-long
app.jwt.expiration-ms=3600000
app.question-bank.upload-directory=${java.io.tmpdir}/lms-question-import-tests

resend.api-key=test-only-resend-key
resend.base-url=http://localhost:9999/emails
resend.from-email=test@example.com
resend.from-name=Test LMS

reset-link.base-url=http://localhost:4200/reset-password
reset-link.expiry-minutes=30
