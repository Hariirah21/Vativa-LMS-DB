spring.datasource.url=${VATIVA_DB_URL}
spring.datasource.username=${VATIVA_DB_USERNAME}
spring.datasource.password=${VATIVA_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8081}

# --- Multimedia Upload ---
lms.multimedia.storage-provider=${MULTIMEDIA_STORAGE_PROVIDER:local}
lms.multimedia.storage-location=${MULTIMEDIA_STORAGE_LOCATION:uploads/multimedia}
lms.multimedia.max-file-size=${MULTIMEDIA_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:110MB}

# --- Resend (email) ---
resend.api-key=${VATIVA_RESEND_API_KEY}
resend.base-url=${VATIVA_RESEND_BASE_URL:https://api.resend.com}
resend.from-email=${VATIVA_RESEND_FROM_EMAIL}
resend.from-name=${VATIVA_RESEND_FROM_NAME:Vativa LMS}

# --- Password Reset Link ---
reset-link.base-url=${RESET_LINK_BASE_URL:http://localhost:4200/auth/reset-password}
reset-link.expiry-minutes=${RESET_LINK_EXPIRY_MINUTES:15}

# --- JWT ---
app.jwt.secret=${VATIVA_JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
