# Neon production-like profile. Secrets are supplied by run-backend-neon.ps1.
spring.datasource.url=jdbc:postgresql://ep-little-surf-azl2u893-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${VATIVA_DB_PASSWORD}
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=5000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=${VATIVA_JWT_SECRET}
app.jwt.expiration-ms=3600000

# Replace these environment variables when email delivery is required.
resend.api-key=${VATIVA_RESEND_API_KEY:local-development-placeholder}
resend.from-email=${VATIVA_RESEND_FROM_EMAIL:local@example.com}
resend.from-name=${VATIVA_RESEND_FROM_NAME:Vativa LMS}

spring.devtools.restart.enabled=false
