# Local-only development profile. Data persists between restarts under ./local-data.
spring.datasource.url=jdbc:h2:file:./local-data/vativa;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Development-only JWT signing key. Production still requires VATIVA_JWT_SECRET.
app.jwt.secret=vativa-local-development-secret-change-before-production
app.jwt.expiration-ms=3600000

# Email calls require real Resend values; these defaults only allow local startup.
resend.api-key=local-development-placeholder
resend.from-email=local@example.com
resend.from-name=Vativa LMS Local

spring.devtools.restart.enabled=false
